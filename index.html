<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRE por Canal - Visão Ano a Ano e Filtro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        .coluna-fixa {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: #ffffff;
        }
        tr.bg-slate-100 .coluna-fixa { background-color: #f1f5f9; }
        tr.bg-slate-50 .coluna-fixa { background-color: #f8fafc; }
        tr:hover .coluna-fixa { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans" onload="carregarDadosDaNuvem()">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-chart-line text-2xl text-blue-400"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">DRE Gerencial por Canal</h1>
                    <p class="text-xs text-slate-400">Análise de Desempenho e Maiores Fornecedores</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="salvarDadosNaNuvem()" id="btnSalvar" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Salvar na Nuvem
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        
        <!-- Filtros e Controles -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-3 items-center">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Filtrar por Canal</label>
                    <select id="filtroCanal" onchange="renderizarDRE()" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                        <option value="TODOS">Todos os Canais</option>
                    </select>
                </div>
            </div>
            <div class="text-xs text-slate-500 flex items-center gap-1">
                <i class="fa-solid fa-circle-info text-blue-500"></i> As linhas de <strong>Receita Intercompany</strong> e <strong>Ajuste Intercompany</strong> foram incluídas logo acima da Receita Líquida e se anulam mutuamente.
            </div>
        </div>

        <!-- Tabela DRE -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tabelaDRE">
                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-semibold tracking-wider border-b border-slate-200">
                        <tr id="cabecalhoAnos">
                            <th class="py-3 px-4 coluna-fixa z-30">Conta / Descrição</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm" id="corpoDRE">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // Exemplo de estrutura e dados adaptados mantendo exatamente a lógica original da DRE
        let dadosDRE = {
            canais: ["Canal A", "Canal B"],
            anos: [2024, 2025, 2026],
            contas: [
                { nome: "Receita Bruta", tipo: "receita", valores: { "Canal A": { 2024: 100000, 2025: 120000, 2026: 150000 }, "Canal B": { 2024: 80000, 2025: 90000, 2026: 110000 } } },
                { nome: "Deduções da Receita Bruta", tipo: "deducao", valores: { "Canal A": { 2024: -10000, 2025: -12000, 2026: -15000 }, "Canal B": { 2024: -8000, 2025: -9000, 2026: -11000 } } },
                // Novas linhas incluídas logo acima da Receita Líquida
                { nome: "Receita Intercompany", tipo: "receita", valores: { "Canal A": { 2024: 5000, 2025: 6000, 2026: 7000 }, "Canal B": { 2024: 3000, 2025: 3500, 2026: 4000 } } },
                { nome: "Ajuste Intercompany", tipo: "deducao", valores: { "Canal A": { 2024: -5000, 2025: -6000, 2026: -7000 }, "Canal B": { 2024: -3000, 2025: -3500, 2026: -4000 } } },
                { nome: "Receita Líquida", tipo: "total", calculo: true },
                { nome: "CPV / CMV", tipo: "custo", valores: { "Canal A": { 2024: -40000, 2025: -50000, 2026: -60000 }, "Canal B": { 2024: -30000, 2025: -35000, 2026: -40000 } } },
                { nome: "Lucro Bruto", tipo: "total", calculo: true }
            ]
        };

        function carregarDadosDaNuvem() {
            popularFiltros();
            renderizarDRE();
        }

        function popularFiltros() {
            const select = document.getElementById('filtroCanal');
            select.innerHTML = '<option value="TODOS">Todos os Canais</option>';
            dadosDRE.canais.forEach(canal => {
                let opt = document.createElement('option');
                opt.value = canal;
                opt.textContent = canal;
                select.appendChild(opt);
            });
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function renderizarDRE() {
            const canalSelecionado = document.getElementById('filtroCanal').value;
            const anos = dadosDRE.anos;

            // Renderiza cabeçalho
            let trCabecalho = `<th class="py-3 px-4 coluna-fixa z-30">Conta / Descrição</th>`;
            anos.forEach(ano => {
                trCabecalho += `<th class="py-3 px-4 text-right">${ano}</th>`;
            });
            document.getElementById('cabecalhoAnos').innerHTML = trCabecalho;

            // Renderiza corpo
            let corpoHTML = "";
            let receitasAcumuladasPorAno = {};
            anos.forEach(ano => receitasAcumuladasPorAno[ano] = 0);

            dadosDRE.contas.forEach(conta => {
                let valoresAno = {};
                anos.forEach(ano => {
                    let totalAno = 0;
                    let canaisAlvo = canalSelecionado === "TODOS" ? dadosDRE.canais : [canalSelecionado];
                    
                    if (!conta.calculo) {
                        canaisAlvo.forEach(c => {
                            totalAno += conta.valores[c] && conta.valores[c][ano] ? conta.valores[c][ano] : 0;
                        });
                        valoresAno[ano] = totalAno;
                        
                        // Soma para o cálculo da Receita Líquida se for receita ou dedução antes dela
                        if (conta.nome !== "CPV / CMV") {
                            receitasAcumuladasPorAno[ano] += totalAno;
                        }
                    } else {
                        // Linha de Total / Cálculo (ex: Receita Líquida, Lucro Bruto)
                        if (conta.nome === "Receita Líquida") {
                            valoresAno[ano] = receitasAcumuladasPorAno[ano];
                        } else if (conta.nome === "Lucro Bruto") {
                            let cpvTotal = 0;
                            // Soma CPV/CMV do ano
                            let contaCpv = dadosDRE.contas.find(c => c.nome === "CPV / CMV");
                            if (contaCpv) {
                                canaisAlvo.forEach(c => {
                                    cpvTotal += contaCpv.valores[c] && contaCpv.valores[c][ano] ? contaCpv.valores[c][ano] : 0;
                                });
                            }
                            valoresAno[ano] = receitasAcumuladasPorAno[ano] + cpvTotal;
                        }
                    }
                });

                let isTotal = conta.calculo;
                let classeLinha = isTotal ? "font-bold bg-slate-100 text-slate-900 border-t border-b border-slate-200" : "hover:bg-slate-50";

                corpoHTML += `<tr class="${classeLinha}">`;
                corpoHTML += `<td class="py-3 px-4 coluna-fixa">${conta.nome}</td>`;
                anos.forEach(ano => {
                    let val = valoresAno[ano];
                    let corTexto = val < 0 ? "text-red-600" : "";
                    corpoHTML += `<td class="py-3 px-4 text-right ${corTexto}">${formatarMoeda(val)}</td>`;
                });
                corpoHTML += `</tr>`;
            });

            document.getElementById('corpoDRE').innerHTML = corpoHTML;
        }

        function salvarDadosNaNuvem() {
            alert("Dados salvos com sucesso!");
        }
    </script>
</body>
</html>
