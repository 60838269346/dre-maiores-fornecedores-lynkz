<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRE por Canal - Visão por Ano, Mês a Mês e Acumulado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 25px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button, select {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover {
            background: #e2e8f0;
        }
        button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .btn-primary {
            background: var(--secondary);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: right;
        }
        th:first-child, td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 1;
        }
        th {
            background-color: #f8fafc;
            color: var(--primary);
        }
        .total-row {
            font-weight: bold;
            background-color: #f1f5f9;
        }
        .negativo {
            color: #dc2626;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 500px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="dre-container">
    <h1>DRE por Canal - Visão por Ano, Mês a Mês e Acumulado</h1>
    
    <div class="controls">
        <div class="btn-group" id="botoes-canais">
            <!-- Canais injetados via JS -->
        </div>
        <div class="btn-group">
            <label for="select-ano" style="align-self: center; font-weight: bold;">Ano:</label>
            <select id="select-ano" onchange="mudarAno(this.value)">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
            </select>
            <button class="btn-primary" onclick="abrirModalSenha()">+ Novo Lançamento</button>
            <button onclick="exportarExcel()">Baixar Excel</button>
            <button onclick="exportarPDF()">Baixar PDF</button>
        </div>
    </div>

    <div id="area-tabela">
        <!-- Tabela DRE dinâmica -->
    </div>
</div>

<!-- Modal Senha / Lançamento -->
<div id="modal-lancamento" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="fecharModal()">&times;</span>
        <h2>Gerenciar Lançamentos</h2>
        
        <div id="div-senha">
            <div class="form-group">
                <label>Senha de Acesso:</label>
                <input type="password" id="input-senha">
            </div>
            <button class="btn-primary" onclick="verificarSenha()">Entrar</button>
        </div>

        <div id="div-form-lancamento" style="display:none;">
            <hr>
            <h3>Novo Registro</h3>
            <div class="form-group">
                <label>Canal / Fornecedor:</label>
                <select id="l-canal">
                    <option value="BOEHRINGER">BOEHRINGER</option>
                    <option value="PREMIER">PREMIER</option>
                    <option value="OURO FINO">OURO FINO</option>
                    <option value="ORGANACT PET">ORGANACT PET</option>
                    <option value="AVERT">AVERT</option>
                    <option value="VANSIL">VANSIL</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ano:</label>
                <select id="l-ano">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mês:</label>
                <select id="l-mes">
                    <option value="01">Janeiro</option>
                    <option value="02">Fevereiro</option>
                    <option value="03">Março</option>
                    <option value="04">Abril</option>
                    <option value="05">Maio</option>
                    <option value="06">Junho</option>
                    <option value="07">Julho</option>
                    <option value="08">Agosto</option>
                    <option value="09">Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tipo de Conta:</label>
                <select id="l-tipo">
                    <option value="receita_bruta">Receita Bruta</option>
                    <option value="impostos">(-) Impostos sobre Vendas</option>
                    <option value="cmv">(-) CMV</option>
                    <option value="pessoal">(-) Gastos com Pessoal</option>
                    <option value="comercial">(-) Despesas Comerciais</option>
                    <option value="fretes">(-) Fretes</option>
                    <option value="administrativas">(-) Despesas Administrativas</option>
                    <option value="tributarias">(-) Despesas Tributárias</option>
                    <option value="outras_despesas">(-) Outras Despesas</option>
                </select>
            </div>
            <div class="form-group">
                <label>Valor (R$):</label>
                <input type="number" step="0.01" id="l-valor">
            </div>
            <button class="btn-primary" onclick="salvarLancamento()">Salvar na Nuvem</button>
            
            <hr style="margin: 20px 0;">
            <h3>Lançamentos Recentes (Excluir)</h3>
            <div id="lista-recentes" style="max-height: 150px; overflow-y: auto; font-size: 12px;"></div>
        </div>
    </div>
</div>

<script>
    const BIN_ID = "67035baee41b4d34e43b8364"; // Substitua pelo seu ID se necessário
    const API_KEY = "$2a$10$tZ9vW7z5y8Q2Y1ZqX5v8g.9v8z9v8z9v8z9v8z9v8z9v8z9v8z9v8"; // Exemplo, mantenha o seu atual se houver
    const SENHA_MESTRE = "lynkz2026"; // Senha padrão de exemplo

    let canais = ["BOEHRINGER", "PREMIER", "OURO FINO", "ORGANACT PET", "AVERT", "VANSIL", "CONSOLIDADO", "CONSOLIDADO_LADO_A_LADO"];
    let canalAtivo = "CONSOLIDADO";
    let anoAtivo = "2026";
    let lancamentos = [];

    async function carregarDados() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await res.json();
            lancamentos = data.record.lancamentos || [];
        } catch (e) {
            console.error("Erro ao carregar dados da nuvem:", e);
            lancamentos = [];
        }
        renderizarBotoes();
        renderizarDRE();
    }

    function renderizarBotoes() {
        let container = document.getElementById("botoes-canais");
        container.innerHTML = "";
        canais.forEach(c => {
            let btn = document.createElement("button");
            let nomeExibicao = c === "CONSOLIDADO" ? "CONSOLIDADO (TOTAL)" : (c === "CONSOLIDADO_LADO_A_LADO" ? "📊 CONSOLIDADO LADO A LADO" : c);
            btn.innerText = nomeExibicao;
            if (c === canalAtivo) btn.classList.add("active");
            btn.onclick = () => {
                canalAtivo = c;
                renderizarBotoes();
                renderizarDRE();
            };
            container.appendChild(btn);
        });
    }

    function mudarAno(ano) {
        anoAtivo = ano;
        renderizarDRE();
    }

    function calcularDadosCanalParaAno(nomeCanal, ano) {
        let mesesAtivos = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];
        let lancsCanalAno = [];
        
        // Lista oficial de fornecedores válidos para evitar puxar lixo ou dados sem vínculo
        const fornecedoresOficiais = ["BOEHRINGER", "PREMIER", "OURO FINO", "ORGANACT PET", "AVERT", "VANSIL"];

        if (nomeCanal === "CONSOLIDADO") {
            // Pega apenas lançamentos do ano ativo E que pertençam estritamente aos fornecedores oficiais
            lancsCanalAno = lancamentos.filter(l => l.ano === ano && fornecedoresOficiais.includes(l.canal));
        } else {
            lancsCanalAno = lancamentos.filter(l => l.canal === nomeCanal && l.ano === ano);
        }

        let dadosMes = {};
        mesesAtivos.forEach(mes => {
            dadosMes[mes] = {
                receita_bruta: 0, impostos: 0, receita_liquida: 0,
                cmv: 0, lucro_bruto: 0, pessoal: 0, comercial: 0,
                fretes: 0, administrativas: 0, tributarias: 0,
                outras_despesas: 0, total_desp: 0, ebitda: 0
            };
        });

        lancsCanalAno.forEach(l => {
            let m = l.mes || "01";
            let t = l.tipo;
            if (dadosMes[m] && dadosMes[m][t] !== undefined) {
                dadosMes[m][t] += Number(l.valor);
            }
        });

        Object.keys(dadosMes).forEach(m => {
            let dm = dadosMes[m];
            dm.receita_liquida = dm.receita_bruta - dm.impostos;
            dm.lucro_bruto = dm.receita_liquida - dm.cmv;
            dm.total_desp = dm.pessoal + dm.comercial + dm.fretes + dm.administrativas + dm.tributarias + dm.outras_despesas;
            dm.ebitda = dm.lucro_bruto - dm.total_desp;
        });

        let acumuladoAno = {
            receita_bruta: 0, impostos: 0, receita_liquida: 0,
            cmv: 0, lucro_bruto: 0, pessoal: 0, comercial: 0,
            fretes: 0, administrativas: 0, tributarias: 0,
            outras_despesas: 0, total_desp: 0, ebitda: 0
        };

        Object.values(dadosMes).forEach(dm => {
            Object.keys(acumuladoAno).forEach(k => {
                acumuladoAno[k] += dm[k];
            });
        });

        return { dadosMes, acumuladoAno };
    }

    function formatarMoeda(val) {
        return val.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderizarDRE() {
        let area = document.getElementById("area-tabela");
        
        if (canalAtivo === "CONSOLIDADO_LADO_A_LADO") {
            renderizarLadoALado(area);
            return;
        }

        let { dadosMes, acumuladoAno } = calcularDadosCanalParaAno(canalAtivo, anoAtivo);
        let mesesNomes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

        let html = `<h3>DRE - ${canalAtivo} (${anoAtivo})</h3><table><thead><tr><th>Estrutura da DRE</th>`;
        mesesNomes.forEach(m => html += `<th>${m}</th>`);
        html += `<th>Acumulado</th><th>A.V. (%)</th></tr></thead><tbody>`;

        let linhas = [
            { label: "Receita Bruta Total", key: "receita_bruta", bold: true },
            { label: "(-) Impostos sobre Vendas", key: "impostos" },
            { label: "(=) Receita Líquida", key: "receita_liquida", bold: true, isLiq: true },
            { label: "(-) Custo das Mercadorias Vendidas (CMV)", key: "cmv" },
            { label: "(=) Lucro Bruto", key: "lucro_bruto", bold: true },
            { label: "(-) Despesas Operacionais (SG&A Totais)", key: "total_desp", bold: true },
            { label: "• Gastos com Pessoal", key: "pessoal", sub: true },
            { label: "• Despesas Comerciais / Embalagens", key: "comercial", sub: true },
            { label: "• Fretes / Entrega Cliente", key: "fretes", sub: true },
            { label: "• Despesas Administrativas", key: "administrativas", sub: true },
            { label: "• Despesas Tributárias", key: "tributarias", sub: true },
            { label: "• Outras Despesas Operacionais", key: "outras_despesas", sub: true },
            { label: "(=) EBITDA / Resultado Operacional", key: "ebitda", bold: true, ebitda: true }
        ];

        let recLiqTotal = acumuladoAno.receita_liquida || 1;

        linhas.forEach(l => {
            let trClass = l.bold ? "total-row" : "";
            html += `<tr class="${trClass}"><td>${l.label}</td>`;
            
            let mesesChaves = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];
            mesesChaves.forEach(mk => {
                let val = dadosMes[mk][l.key];
                let valFormatado = formatarMoeda(val);
                if (val < 0) valFormatado = `(${formatarMoeda(Math.abs(val))})`;
                html += `<td>${valFormatado}</td>`;
            });

            let valAcum = acumuladoAno[l.key];
            let acumFormatado = formatarMoeda(valAcum);
            if (valAcum < 0) acumFormatado = `(${formatarMoeda(Math.abs(valAcum))})`;
            html += `<td><b>${acumFormatado}</b></td>`;

            let av = (valAcum / recLiqTotal) * 100;
            html += `<td>${av.toFixed(2)}%</td>`;

            html += `</tr>`;
        });

        html += `</tbody></table>`;
        area.innerHTML = html;
    }

    function renderizarLadoALado(area) {
        let fornecedoresOficiais = ["BOEHRINGER", "PREMIER", "OURO FINO", "ORGANACT PET", "AVERT", "VANSIL"];
        let dadosFornecedores = {};

        fornecedoresOficiais.forEach(f => {
            dadosFornecedores[f] = calcularDadosCanalParaAno(f, anoAtivo).acumuladoAno;
        });

        // Calcula consolidado geral somando os oficiais
        let consolidadoGeral = calcularDadosCanalParaAno("CONSOLIDADO", anoAtivo).acumuladoAno;

        let html = `<h3>DRE Detalhada - 📊 CONSOLIDADO LADO A LADO (${anoAtivo})</h3><table><thead><tr><th>Estrutura da DRE</th>`;
        fornecedoresOficiais.forEach(f => {
            html += `<th>${f} (Acum.)</th><th>A.V.</th>`;
        });
        html += `<th>TOTAL GERAL (Acum.)</th><th>A.V.</th></tr></thead><tbody>`;

        let linhas = [
            { label: "Receita Bruta Total", key: "receita_bruta", bold: true },
            { label: "(-) Impostos sobre Vendas", key: "impostos" },
            { label: "(=) Receita Líquida", key: "receita_liquida", bold: true },
            { label: "(-) Custo das Mercadorias Vendidas (CMV)", key: "cmv" },
            { label: "(=) Lucro Bruto", key: "lucro_bruto", bold: true },
            { label: "(-) Despesas Operacionais (SG&A Totais)", key: "total_desp", bold: true },
            { label: "• Gastos com Pessoal", key: "pessoal" },
            { label: "• Despesas Comerciais / Embalagens", key: "comercial" },
            { label: "• Fretes / Entrega Cliente", key: "fretes" },
            { label: "• Despesas Administrativas", key: "administrativas" },
            { label: "• Despesas Tributárias", key: "tributarias" },
            { label: "• Outras Despesas Operacionais", key: "outras_despesas" },
            { label: "(=) EBITDA / Resultado Operacional", key: "ebitda", bold: true }
        ];

        let recLiqGeral = consolidadoGeral.receita_liquida || 1;

        linhas.forEach(l => {
            let trClass = l.bold ? "total-row" : "";
            html += `<tr class="${trClass}"><td>${l.label}</td>`;

            fornecedoresOficiais.forEach(f => {
                let valF = dadosFornecedores[f][l.key];
                let recLiqF = dadosFornecedores[f].receita_liquida || 1;
                let avF = (valF / recLiqF) * 100;
                
                let valFmt = formatarMoeda(valF);
                if (valF < 0) valFmt = `(${formatarMoeda(Math.abs(valF))})`;

                html += `<td>${valFmt}</td><td>${avF.toFixed(2)}%</td>`;
            });

            let valG = consolidadoGeral[l.key];
            let avG = (valG / recLiqGeral) * 100;
            let valGFmt = formatarMoeda(valG);
            if (valG < 0) valGFmt = `(${formatarMoeda(Math.abs(valG))})`;

            html += `<td><b>${valGFmt}</b></td><td><b>${avG.toFixed(2)}%</b></td></tr>`;
        });

        html += `</tbody></table>`;
        area.innerHTML = html;
    }

    function abrirModalSenha() {
        document.getElementById("modal-lancamento").style.display = "flex";
        document.getElementById("div-senha").style.display = "block";
        document.getElementById("div-form-lancamento").style.display = "none";
        document.getElementById("input-senha").value = "";
    }

    function fecharModal() {
        document.getElementById("modal-lancamento").style.display = "none";
    }

    function verificarSenha() {
        let senha = document.getElementById("input-senha").value;
        if (senha === SENHA_MESTRE) {
            document.getElementById("div-senha").style.display = "none";
            document.getElementById("div-form-lancamento").style.display = "block";
            carregarListaRecentes();
        } else {
            alert("Senha incorreta!");
        }
    }

    function carregarListaRecentes() {
        let lista = document.getElementById("lista-recentes");
        lista.innerHTML = "";
        lancamentos.slice(-10).reverse().forEach((l, index) => {
            let realIndex = lancamentos.length - 1 - index;
            let div = document.createElement("div");
            div.style.display = "flex";
            div.style.justifyContent = "space-between";
            div.style.marginBottom = "5px";
            div.innerHTML = `<span><b>${l.canal}</b> (${l.ano}/${l.mes}) - ${l.tipo}: R$ ${l.valor}</span>
                             <button onclick="excluirLancamento(${realIndex})" style="padding: 2px 6px; background:#dc2626; color:white; border:none; border-radius:4px;">Excluir</button>`;
            lista.appendChild(div);
        });
    }

    async function salvarLancamento() {
        let novo = {
            canal: document.getElementById("l-canal").value,
            ano: document.getElementById("l-ano").value,
            mes: document.getElementById("l-mes").value,
            tipo: document.getElementById("l-tipo").value,
            valor: parseFloat(document.getElementById("l-valor").value) || 0
        };

        lancamentos.push(novo);

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ lancamentos: lancamentos })
            });

            if (res.ok) {
                alert("Lançamento salvo com sucesso na nuvem!");
                document.getElementById("l-valor").value = "";
                carregarListaRecentes();
                renderizarDRE();
            } else {
                alert("Erro ao salvar na nuvem.");
            }
        } catch (e) {
            console.error(e);
            alert("Erro de conexão com a nuvem.");
        }
    }

    async function excluirLancamento(index) {
        if (!confirm("Deseja realmente excluir este lançamento?")) return;
        
        lancamentos.splice(index, 1);

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ lancamentos: lancamentos })
            });

            if (res.ok) {
                alert("Lançamento excluído com sucesso!");
                carregarListaRecentes();
                renderizarDRE();
            } else {
                alert("Erro ao atualizar a nuvem.");
            }
        } catch (e) {
            console.error(e);
            alert("Erro de conexão com a nuvem.");
        }
    }

    function exportarExcel() {
        let wb = XLSX.utils.table_to_book(document.querySelector("#area-tabela table"), {sheet: "DRE"});
        XLSX.writeFile(wb, `DRE_${canalAtivo}_${anoAtivo}.xlsx`);
    }

    function exportarPDF() {
        let element = document.getElementById("dre-container");
        let opt = {
            margin:       10,
            filename:     `DRE_${canalAtivo}_${anoAtivo}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().from(element).set(opt).save();
    }

    // Inicialização
    carregarDados();
</script>

</body>
</html>
